<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Formularios Conexión Glocal</title>
  </head>
  <body>
    <form name="contact" method="POST" action="/" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="subject" value="Nuevo lead — Formulario de contacto" data-remove-prefix />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="service" />
      <textarea name="message"></textarea>
      <input name="language" />
    </form>

    <form name="brand-dna" method="POST" action="/" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="subject" value="Nueva solicitud — Diagnóstico de ADN de Marca" data-remove-prefix />
      <input name="url" type="url" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="language" />
    </form>

    <form name="newsletter" method="POST" action="/" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="subject" value="Nueva suscripción — Newsletter Glocal" data-remove-prefix />
      <input name="email" type="email" />
      <input name="language" />
    </form>
  </body>
</html>
